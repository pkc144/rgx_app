apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

/**
 * React Native configuration
 */
react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = true
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    namespace "com.rgx.aq"

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    ndkVersion rootProject.ext.ndkVersion

    /**
     * ABI splits - disabled for development (enable for release builds)
     * This creates separate APKs per architecture
     */
    splits {
        abi {
            enable false  // Disabled for dev - builds universal APK
            reset()
            include "arm64-v8a", "x86_64"
            universalApk true
        }
    }

    defaultConfig {
        applicationId "com.rgx.aq"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 58
        versionName "5.4.4"

        missingDimensionStrategy "store", "play"

        // Build for arm64-v8a (production) and x86_64 (emulator development)
        // Note: Some native modules (reanimated/worklets) may not work on emulator
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    /**
     * ✅ Correct placement (NOT inside defaultConfig)
     */
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    /**
     * Keep only if duplicate STL error appears
     */
    packagingOptions {
        pickFirst "lib/arm64-v8a/libc++_shared.so"
        pickFirst "lib/x86_64/libc++_shared.so"
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }

        release {
            if (project.hasProperty("MYAPP_UPLOAD_STORE_FILE")) {
                storeFile file(MYAPP_UPLOAD_STORE_FILE)
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles(
                getDefaultProguardFile("proguard-android.txt"),
                "proguard-rules.pro"
            )
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation project(":react-native-vector-icons")
    implementation project(":react-native-config")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")
apply plugin: "com.google.gms.google-services"

// Force every library's generateCodegenArtifactsFromSchema to finish before
// any :app CMake/NDK task runs. Without this, a clean assembleRelease races:
// Android-autolinking.cmake references
// node_modules/*/android/build/generated/source/codegen/jni/ dirs that
// per-library codegen hasn't created yet, and cmake configure fails with
// "add_subdirectory given source ... which is not an existing directory".
//
// The closure is lazy — Gradle resolves it at execution-graph construction,
// by which point every subproject has been evaluated and its codegen task
// has been registered. Eager findByName(...) from whenTaskAdded returns null
// for most libraries and silently wires nothing.
tasks.whenTaskAdded { task ->
    if (task.name.startsWith("configureCMake") ||
        task.name.startsWith("buildCMake") ||
        task.name.startsWith("externalNativeBuild")) {
        task.dependsOn({
            rootProject.subprojects.findResults { sub ->
                sub.tasks.findByName("generateCodegenArtifactsFromSchema")
            }
        })
    }
}

/**
 * Variant-specific google-services.json handling
 */
def appVariant = project.hasProperty("APP_VARIANT") ? APP_VARIANT : "arfs"

android.applicationVariants.all { variant ->
    def variantName = variant.name
    def googleServicesFile =
            file("${project.rootDir}/android/app/src/${variantName}/google-services.json")

    if (!googleServicesFile.exists()) {
        googleServicesFile =
                file("${project.rootDir}/android/app/src/main/google-services.json")
    }

    if (googleServicesFile.exists()) {
        copy {
            from googleServicesFile
            into "${project.rootDir}/android/app"
            rename { "google-services.json" }
        }
    }
}

// Brand-asset guard (2026-07-19): this fork must NEVER ship the upstream
// AlphaQuark launcher icon — zamzam 6.4.4 went to Play with the wrong logo
// after an upstream sync clobbered res/mipmap. Fails every build whose
// launcher icon matches a known upstream icon hash.
def upstreamAqIconHashes = ["4202d60d4c51011afc31582434c11adf","5470106c93edb8328ce36a907c1c6fc1","68ae2d8228e3c37967f70a199ce5e84d","6f328e1c9673e74a36a428c4ff8576b2","85339971c79729c348292b45c5852523","b456f35572b74c6fd3f0ab688ef5fccb","ba473df067ba6f144b96edd94907a3a0","ccde0716835756e4645683b80a23147e","d2f34777fca175044da9287173d8aecc","ff441887d26fef7c44d7fb2056441495"]
tasks.register("brandIconAudit") {
    doLast {
        def md = java.security.MessageDigest.getInstance("MD5")
        ["ic_launcher.png", "ic_launcher_foreground.png"].each { name ->
            ["mdpi","hdpi","xhdpi","xxhdpi","xxxhdpi"].each { d ->
                def f = file("src/main/res/mipmap-${d}/${name}")
                if (f.exists()) {
                    def hash = md.digest(f.bytes).collect { String.format("%02x", it) }.join()
                    if (upstreamAqIconHashes.contains(hash)) {
                        throw new GradleException("BRAND GUARD: ${f} is the upstream AlphaQuark icon — restore this fork's brand icon before building (see git history of res/mipmap).")
                    }
                }
            }
        }
    }
}
preBuild.dependsOn("brandIconAudit")
