name: equitypro
description: "EquityPro by RGXResearch - Stock Advisory App"
publish_to: 'none'
version: 1.3.2+43

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  lucide_icons: ^0.257.0
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_spinkit: ^5.2.1

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Networking & API
  dio: ^5.7.0
  socket_io_client: ^2.0.3+1
  web_socket_channel: ^3.0.1

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  firebase_messaging: ^15.1.5
  firebase_analytics: ^11.3.5

  # Authentication
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4

  # Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Payment Gateways
  razorpay_flutter: ^1.3.7

  # WebView & Browser
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1

  # Utilities
  intl: any
  uuid: ^4.5.1
  crypto: ^3.0.5
  encrypt: ^5.0.3
  jwt_decoder: ^2.0.1
  connectivity_plus: ^6.1.0
  package_info_plus: ^8.1.1
  device_info_plus: ^11.1.1
  share_plus: ^10.1.2

  # Charts & Data Visualization
  fl_chart: ^0.70.0
  syncfusion_flutter_charts: ^28.1.38
  percent_indicator: ^4.2.3

  # UI Components
  flutter_slidable: ^3.1.1
  pull_to_refresh_flutter3: ^2.0.2
  flutter_local_notifications: ^18.0.1
  fluttertoast: ^8.2.8
  modal_bottom_sheet: ^3.0.0
  dropdown_button2: ^2.3.9
  table_calendar: ^3.1.2

  # Forms & Validation
  flutter_form_builder: ^10.0.1
  form_builder_validators: ^11.0.0

  # Environment & Config
  flutter_dotenv: ^5.2.1

  # JSON Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

  # Logging
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.2
  json_serializable: ^6.8.0
  freezed: ^2.5.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/
    - assets/animations/
    - .env

  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Light.otf
          weight: 300
        - asset: assets/fonts/Satoshi-Regular.ttf
          weight: 400
        - asset: assets/fonts/Satoshi-Medium.ttf
          weight: 500
        - asset: assets/fonts/Satoshi-Bold.otf
          weight: 700
        - asset: assets/fonts/Satoshi-Black.otf
          weight: 900
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Gillies
      fonts:
        - asset: assets/fonts/Gillies.ttf
